[package]
name = "jamx-core"
description = "JAMX: a non-custodial exchange service for JAM - pure logic shared by the PVM service and host tools"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[features]
default = ["std"]
std = []
# Log gas spent per record and per phase through the host (development aid).
profile = []

[dependencies]
ed25519-dalek = { version = "2.1", default-features = false }
sha2 = { version = "0.10", default-features = false }
blake2 = { version = "0.10", default-features = false }

[dev-dependencies]
ed25519-dalek = { version = "2.1", default-features = false, features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
